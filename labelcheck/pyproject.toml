[project]
name = "labelcheck"
version = "0.4.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S"]
ignore = ["S101", "S311", "S603", "S607", "B008", "S104", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E702", "E731", "E501"]
"migrations/*" = ["S"]
"tools/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
